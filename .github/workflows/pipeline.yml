name: ReleaseOps CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: Publish and optionally deploy this main-branch commit
        type: choice
        options: [none, staging, production]
        default: none

permissions:
  contents: read

jobs:
  application-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/rehearse.py
      - run: python -m compileall -q releaseops scripts tests
      - run: node --check releaseops/static/app.js
      - run: bash -n scripts/deploy.sh scripts/rollback.sh scripts/container_rehearsal.sh

  container-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: bash scripts/container_rehearsal.sh

  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  infrastructure-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/aws init -backend=false -input=false
      - run: terraform -chdir=infra/aws validate

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [application-checks, container-checks, browser-checks, infrastructure-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          build-args: VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_environment != 'none' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: [self-hosted, Linux, X64, releaseops]
    environment: ${{ inputs.deploy_environment }}
    concurrency:
      group: deploy-${{ inputs.deploy_environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DOCKER_CONFIG: ${{ runner.temp }}/releaseops-docker-config
      STATE_DIR: /opt/releaseops/state
      IMAGE: ${{ needs.publish.outputs.image }}
      TARGET_ENV: ${{ inputs.deploy_environment }}
      EXPECTED_VERSION: ${{ github.sha }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGISTRY_USER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate image pull
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: Deploy and verify
        run: bash scripts/deploy.sh "$TARGET_ENV" "$IMAGE"
      - name: Clear registry credentials
        if: always()
        run: docker logout ghcr.io
